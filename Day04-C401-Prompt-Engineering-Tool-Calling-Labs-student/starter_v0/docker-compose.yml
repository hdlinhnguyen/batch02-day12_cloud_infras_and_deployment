version: '3.8'

services:
  research-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: research-agent:latest
    container_name: research_agent_app
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - PYTHONUNBUFFERED=1
